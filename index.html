<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>国内信用证融资成本计算器</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --primary:#1a73e8; --text:#202124; --text-secondary:#5f6368; --border:#dadce0; --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.08); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; max-width:100%; overflow-x:hidden; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; line-height:1.5; }
  .app { max-width:600px; margin:0 auto; padding:16px 12px 30px; }
  .header { text-align:center; margin-bottom:20px; }
  .header h1 { font-size:22px; font-weight:700; }
  .header p { font-size:12px; color:var(--text-secondary); margin-top:4px; }
  .card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border); margin-bottom:14px; }
  .card-header { padding:12px 16px; border-bottom:1px solid var(--border); font-size:14px; font-weight:600; border-top:3px solid var(--primary); }
  .card-body { padding:16px; }
  .form-group { margin-bottom:12px; }
  .form-label { font-size:12px; color:var(--text-secondary); margin-bottom:4px; }
  .input-row { display:flex; align-items:center; background:#f8f9fa; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .input-row span { padding:0 10px; font-size:12px; color:var(--text-secondary); }
  .input-row input { flex:1; border:none; background:transparent; padding:12px; font-size:16px; outline:none; text-align:right; width:100%; }
  .btn { width:100%; padding:14px; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; margin-top:8px; }
  .btn-primary { background:var(--primary); color:#fff; -webkit-appearance:none; }
  .btn-primary:active { opacity:.8; }
  .metric-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .metric { background:#f8f9fa; border-radius:8px; padding:14px 12px; text-align:center; }
  .metric .label { font-size:11px; color:var(--text-secondary); }
  .metric .value { font-size:22px; font-weight:700; margin-top:4px; }
  .metric .value.pct { color:var(--primary); }
  .detail-row { display:flex; justify-content:space-between; padding:8px 0; font-size:13px; border-bottom:1px solid #f0f0f0; }
  .detail-row:last-child { border-bottom:none; font-weight:700; font-size:14px; }
  .verdict { padding:14px; border-radius:8px; font-size:14px; font-weight:600; text-align:center; margin-top:12px; background:#e8f0fe; color:var(--primary); }
  .verdict.loan { background:#e6f4ea; color:#0d904f; }
  #result-area { margin-top:16px; }
  hr { border:none; border-top:1px solid var(--border); margin:14px 0; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>国内信用证融资成本计算器</h1>
    <p>手机专用版</p>
  </div>

  <div class="card">
    <div class="card-header">参数设置</div>
    <div class="card-body">
      <div class="form-group">
        <div class="form-label">开证金额</div>
        <div class="input-row"><span>¥</span><input id="amount" type="text" value="14290000"></div>
      </div>
      <div class="form-group">
        <div class="form-label">保证金比例</div>
        <div class="input-row"><input id="depositRatio" type="text" value="30"><span>%</span></div>
      </div>
      <div class="form-group">
        <div class="form-label">期限（月）</div>
        <div class="input-row"><input id="termMonths" type="text" value="6"><span>个月</span></div>
      </div>
      <div class="form-group">
        <div class="form-label">贴现利率（年化 %）</div>
        <div class="input-row"><input id="discountRate" type="text" value="1.50"><span>%</span></div>
      </div>
      <hr>
      <div class="form-group">
        <div class="form-label">流贷利率（年化 %）</div>
        <div class="input-row"><input id="loanRate" type="text" value="2.11"><span>%</span></div>
      </div>
      <button class="btn btn-primary" id="calcBtn">计算</button>
    </div>
  </div>

  <div id="result-area"></div>
</div>

<script>
function getVal(id) {
  var el = document.getElementById(id);
  return el ? el.value : '';
}

function parseNum(s) {
  if (!s) return 0;
  return parseFloat(String(s).replace(/[,，\s¥]/g, '')) || 0;
}

function fmt(v) {
  return (v || 0).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function fmtPct(v) {
  return ((v || 0) * 100).toFixed(4) + '%';
}

function calculate() {
  var amount = parseNum(getVal('amount'));
  var depositRatio = parseNum(getVal('depositRatio')) / 100;
  var deposit = Math.round(amount * depositRatio);
  var exposure = amount - deposit;
  var termMonths = parseInt(getVal('termMonths'), 10) || 6;
  var days = termMonths * 30;
  var discountRate = parseNum(getVal('discountRate')) / 100;
  var loanRate = parseNum(getVal('loanRate')) / 100;
  var dayFraction = days / 360;

  var discountInterest = Math.round(discountRate * amount * dayFraction * 100) / 100;
  var feeRate = 0.0012;
  var issuanceFee = Math.round(feeRate * amount * 100) / 100;
  var feeSubtotal = discountInterest + issuanceFee;
  var depositIntRate = 0.012;
  var depositInterest = Math.round(depositIntRate * deposit * dayFraction * 100) / 100;
  var totalCost = feeSubtotal - depositInterest;
  var annualRate = (exposure > 0 && days > 0) ? (totalCost / exposure / days * 360) : 0;
  var loanTotalCost = Math.round(exposure * loanRate * dayFraction * 100) / 100;
  var diff = loanTotalCost - totalCost;

  var html = '';
  html += '<div class="card"><div class="card-body">';
  html += '<div class="metric-grid">';
  html += '<div class="metric"><div class="label">融资敞口</div><div class="value">¥' + fmt(exposure) + '</div></div>';
  html += '<div class="metric"><div class="label">年化成本率</div><div class="value pct">' + fmtPct(annualRate) + '</div></div>';
  html += '<div class="metric"><div class="label">信用证总成本</div><div class="value">¥' + fmt(totalCost) + '</div></div>';
  html += '<div class="metric"><div class="label">流贷总成本</div><div class="value">¥' + fmt(loanTotalCost) + '</div></div>';
  html += '</div>';
  html += '<div class="detail-row"><span>① 福费廷贴现利息</span><span>¥' + fmt(discountInterest) + '</span></div>';
  html += '<div class="detail-row"><span>② 开证手续费 (0.12%)</span><span>¥' + fmt(issuanceFee) + '</span></div>';
  html += '<div class="detail-row"><span>③ 保证金存款利息 (1.20%)</span><span>−¥' + fmt(depositInterest) + '</span></div>';
  html += '<div class="detail-row"><span>融资总成本</span><span>¥' + fmt(totalCost) + '</span></div>';
  html += '</div></div>';

  var verdictClass = diff > 0 ? '' : ' loan';
  var verdictText = diff > 0 ? '国内信用证更优，节省 ¥' + fmt(diff) : '流动资金贷款更优，节省 ¥' + fmt(-diff);
  html += '<div class="verdict' + verdictClass + '">' + verdictText + '</div>';

  var resArea = document.getElementById('result-area');
  if (resArea) {
    resArea.innerHTML = html;
    try { resArea.scrollIntoView({behavior:'smooth',block:'start'}); } catch(e) {}
  }
}

// Bind button click
document.getElementById('calcBtn').addEventListener('click', calculate);

// Auto calculate on load
calculate();
</script>
</body>
</html>
