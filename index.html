<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国内信用证融资成本计算器</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #fff;
    --primary: #1a73e8;
    --primary-light: #e8f0fe;
    --danger: #ea4335;
    --danger-light: #fce8e6;
    --success: #0d904f;
    --success-light: #e6f4ea;
    --warn: #e37400;
    --warn-light: #fef7e0;
    --text: #202124;
    --text-secondary: #5f6368;
    --border: #dadce0;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app { max-width: 1240px; margin: 0 auto; padding: 28px 24px 40px; }

  .header { text-align: center; margin-bottom: 28px; }
  .header h1 { font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 4px; letter-spacing: -.3px; }
  .header p { font-size: 13px; color: var(--text-secondary); }

  .layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 24px;
    align-items: start;
  }

  #input-card { position: sticky; top: 28px; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    margin-bottom: 20px;
    transition: box-shadow .2s;
  }
  .card:hover { box-shadow: 0 2px 6px rgba(0,0,0,.1), 0 1px 3px rgba(0,0,0,.06); }
  .card-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-header .icon { font-size: 16px; }
  .card-body { padding: 18px 20px; }

  #input-card { border-top: 3px solid var(--primary); }
  #result-content > .card:first-child { border-top: 3px solid var(--primary); }

  .collapsible .card-header { cursor: pointer; user-select: none; transition: background .15s; }
  .collapsible .card-header:hover { background: #fafbfc; }
  .collapsible .card-header::after { content: '\25BC'; font-size: 10px; color: #999; margin-left: auto; transition: transform .2s; }
  .collapsible.collapsed .card-header::after { transform: rotate(-90deg); }
  .collapsible.collapsed .card-body { display: none; }

  .input-section { margin-bottom: 12px; }
  .input-section:last-child { margin-bottom: 0; }
  .section-label {
    font-size: 11px; font-weight: 600; color: var(--primary);
    text-transform: uppercase; letter-spacing: .6px;
    margin-bottom: 10px; padding-left: 2px;
  }
  .form-group { margin-bottom: 10px; }
  .form-group:last-child { margin-bottom: 0; }
  .form-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
  .form-label span:first-child { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
  .form-label .hint { font-size: 10px; color: #aaa; }
  .input-row {
    display: flex; align-items: center; background: #f8f9fa;
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    transition: border .15s, box-shadow .15s;
  }
  .input-row:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(26,115,232,.12); }
  .input-prefix { padding: 0 10px; font-size: 13px; color: var(--text-secondary); flex-shrink: 0; }
  .input-row input {
    flex: 1; border: none; background: transparent; padding: 8px 12px;
    font-size: 14px; font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-variant-numeric: tabular-nums; outline: none; text-align: right;
  }
  .input-row input::placeholder { color: #ccc; font-family: inherit; }
  .input-suffix { padding: 0 12px; font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }

  .btn {
    width: 100%; padding: 10px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; margin-top: 8px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #1765cc; box-shadow: 0 1px 4px rgba(26,115,232,.3); }
  .btn-primary:active { transform: scale(.98); }
  .btn-reset { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); margin-top: 6px; font-size: 12px; padding: 7px; }
  .btn-reset:hover { background: #f1f3f4; }

  .result-empty { text-align: center; padding: 80px 20px; color: #ccc; font-size: 14px; }
  .result-empty .icon { font-size: 48px; margin-bottom: 12px; }

  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metric {
    background: #f8f9fa; border-radius: 10px; padding: 16px 18px; text-align: center;
    transition: background .15s;
  }
  .metric:hover { background: #f1f3f4; }
  .metric .label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
  .metric .value {
    font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }
  .metric .value.pct { color: var(--primary); }
  .metric .value.cny { color: var(--text); }

  .detail-row {
    display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px;
  }
  .detail-row .desc { color: var(--text-secondary); font-size: 11px; }
  .detail-row .amount {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-variant-numeric: tabular-nums; font-weight: 500;
  }
  .detail-row .amount.income { color: var(--success); }
  .detail-row.total {
    border-top: 1px solid var(--border); margin-top: 4px; padding-top: 8px;
    font-weight: 700; font-size: 14px;
  }
  .detail-row.formula { color: var(--text-secondary); font-size: 11px; font-style: italic; padding: 2px 0; }

  .compare-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 16px; }
  .compare-table th {
    text-align: left; padding: 8px 12px; background: #f8f9fa;
    font-weight: 600; color: var(--text-secondary); font-size: 12px; border-bottom: 2px solid var(--border);
  }
  .compare-table td {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums; font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }
  .compare-table tr:last-child td { border-bottom: none; }
  .highlight-winner { background: var(--success-light); font-weight: 600; color: var(--success); }
  .highlight-loser { color: var(--danger); }

  .verdict {
    padding: 14px 18px; border-radius: 10px; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
  }
  .verdict.lc-wins { background: var(--primary-light); color: var(--primary); }
  .verdict.loan-wins { background: var(--success-light); color: var(--success); }
  .verdict.neutral { background: var(--warn-light); color: var(--warn); }

  .rate-strip {
    display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap;
  }
  .rate-chip {
    flex: 1; min-width: 100px; text-align: center; padding: 14px 10px;
    border-radius: 10px; cursor: default; transition: transform .15s, box-shadow .15s;
  }
  .rate-chip:hover { transform: translateY(-2px); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .rate-chip .chip-month { font-size: 11px; font-weight: 600; margin-bottom: 5px; opacity: .85; }
  .rate-chip .chip-rate { font-size: 20px; font-weight: 700; font-family: "SF Mono", "Menlo", "Consolas", monospace; }
  .rate-chip .chip-delta { font-size: 10px; margin-top: 3px; opacity: .8; }
  .rate-chip.base { background: #f1f3f4; color: var(--text-secondary); }
  .rate-chip.low  { background: #e6f4ea; color: #0d8040; }
  .rate-chip.mid  { background: #fef7e0; color: #c26400; }
  .rate-chip.high { background: #fce8e6; color: #c5221f; }

  /* 表格滚动包裹 */
  .turnover-scroll { overflow-x: auto; }

  .turnover-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .turnover-table th {
    text-align: center; padding: 10px 8px; background: #f8f9fa;
    font-weight: 600; color: var(--text-secondary); font-size: 11px; border-bottom: 2px solid var(--border);
  }
  .turnover-table td {
    padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--border);
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-variant-numeric: tabular-nums; font-size: 13px;
  }
  .turnover-table td.col-rate {
    font-size: 16px; font-weight: 700; min-width: 90px;
  }
  .turnover-table tr.row-base { background: #fafafa; }
  .turnover-table tr.row-base td.col-rate { color: var(--text-secondary); font-size: 14px; }
  .turnover-table tr.row-best { background: #e6f4ea; }
  .turnover-table tr.row-good { background: #f4faf6; }

  .tag-covered {
    display: inline-block; background: var(--success); color: #fff;
    padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600;
  }
  .tag-partial {
    display: inline-block; background: var(--warn); color: #fff;
    padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600;
  }
  .tag-none {
    display: inline-block; background: #e8eaed; color: #999;
    padding: 3px 10px; border-radius: 4px; font-size: 11px;
  }

  .formula-card {
    margin-top: 14px; padding: 14px 16px; background: #f8f9fa;
    border-radius: 8px; font-size: 12px; color: var(--text-secondary); line-height: 1.8;
  }

  hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

  .sensitivity-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  .sensitivity-table th {
    text-align: center; padding: 8px 6px; background: #f8f9fa;
    font-weight: 600; color: var(--text-secondary); font-size: 11px; border-bottom: 2px solid var(--border);
  }
  .sensitivity-table td {
    padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border);
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-variant-numeric: tabular-nums; font-size: 12px;
  }
  .row-lc { color: var(--primary); }
  .row-loan { color: var(--success); }
  .row-tie { color: var(--warn); }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .turnover-scroll { overflow-x: auto; }
  }
</style>
<!-- 引入 html2canvas 用于海报生成 -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>国内信用证融资成本计算器</h1>
    <p>信用证融资成本测算 &middot; 流动资金贷款对比 &middot; 资金周转理财收益分析</p>
  </div>

  <div class="layout">
    <!-- ====== 左侧：输入区 ====== -->
    <div class="card" id="input-card">
      <div class="card-header"><span class="icon">&#9881;</span> 参数设置</div>
      <div class="card-body">
        <div class="input-section">
          <div class="section-label">融资参数</div>
          <div class="form-group">
            <div class="form-label"><span>开证金额</span></div>
            <div class="input-row"><span class="input-prefix">¥</span><input id="amount" type="text" value="14,290,000" oninput="updateDeposit()"></div>
          </div>
          <div class="form-group">
            <div class="form-label"><span>保证金比例</span></div>
            <div class="input-row"><input id="depositRatio" type="text" value="30.00" style="text-align:right" oninput="updateDeposit()"><span class="input-suffix">%</span></div>
          </div>
          <div class="form-group">
            <div class="form-label"><span>保证金</span><span class="hint">= 开证金额 × 比例</span></div>
            <div class="input-row"><span class="input-prefix">¥</span><input id="deposit" type="text" value="4,287,000" readonly style="background:#f0f0f0;color:#666"></div>
          </div>
          <div class="form-group">
            <div class="form-label"><span>贴现利率（年化）</span><span class="hint">福费廷 · 按 30/360 天折算</span></div>
            <div class="input-row"><input id="discountRate" type="text" value="1.50" style="text-align:right"><span class="input-suffix">%</span></div>
          </div>
          <div class="form-group">
            <div class="form-label"><span>开证手续费率</span><span class="hint">一次性</span></div>
            <div class="input-row"><input id="feeRate" type="text" value="0.12" style="text-align:right"><span class="input-suffix">%</span></div>
          </div>
          <div class="form-group">
            <div class="form-label"><span>保证金存款利率（年化）</span></div>
            <div class="input-row"><input id="depositIntRate" type="text" value="1.20" style="text-align:right"><span class="input-suffix">%</span></div>
          </div>
          <div class="form-group">
            <div class="form-label"><span>承兑费</span><span class="hint">按月计收</span></div>
            <div class="input-row"><span class="input-prefix">¥</span><input id="acceptanceFee" type="text" value="0"></div>
          </div>
          <div class="form-group">
            <div class="form-group" style="margin-bottom:12px">
              <div class="form-label"><span>期限计算方式</span></div>
              <div style="display:flex;gap:16px">
                <label style="font-size:13px;cursor:pointer"><input type="radio" name="dateMode" value="month" checked onchange="toggleDateMode()"> 按月</label>
                <label style="font-size:13px;cursor:pointer"><input type="radio" name="dateMode" value="day" onchange="toggleDateMode()"> 按日</label>
              </div>
            </div>
            <div class="form-group">
              <div class="form-label"><span>起息日</span></div>
              <div class="input-row"><input id="startDate" type="date" value="2026-08-09" onchange="syncDates()" disabled style="color:#aaa"></div>
            </div>
            <div class="form-group">
              <div class="form-label"><span>到期日</span></div>
              <div class="input-row"><input id="endDate" type="date" value="2027-02-09" onchange="syncDates()" disabled style="color:#aaa"></div>
            </div>
            <div class="form-group">
              <div class="form-label"><span>期限</span><span class="hint" id="dateHint"></span></div>
              <div class="input-row"><input id="termMonths" type="text" value="6" style="text-align:right"><span class="input-suffix">个月</span></div>
            </div>
          </div>
        </div>
        <hr>
        <div class="input-section">
          <div class="section-label">对比参数</div>
          <div class="form-group">
            <div class="form-label"><span>流动资金贷款利率（年化）</span></div>
            <div class="input-row"><input id="loanRate" type="text" value="2.11" style="text-align:right"><span class="input-suffix">%</span></div>
          </div>
        </div>
        <hr>
        <div class="input-section">
          <div class="section-label">理财产品利率（年化）&mdash; 周转分析</div>
          <div class="form-group">
            <div class="form-label"><span>3 个月理财</span></div>
            <div class="input-row"><input id="wm3mRate" type="text" value="2.10" style="text-align:right"><span class="input-suffix">%</span></div>
          </div>
          <div class="form-group">
            <div class="form-label"><span>2 个月理财</span></div>
            <div class="input-row"><input id="wm2mRate" type="text" value="1.70" style="text-align:right"><span class="input-suffix">%</span></div>
          </div>
          <div class="form-group">
            <div class="form-label"><span>1 个月理财</span></div>
            <div class="input-row"><input id="wm1mRate" type="text" value="1.70" style="text-align:right"><span class="input-suffix">%</span></div>
          </div>
        </div>
        <button class="btn btn-primary" onclick="calculate()">计算</button>
        <button class="btn btn-reset" onclick="resetForm()">恢复默认值</button>
      </div>
    </div>

    <!-- ====== 右侧：结果区 ====== -->
    <div id="result-area">
      <div class="card result-empty" id="result-empty">
        <div class="icon">&#128202;</div>
        <div>点击「计算」查看结果</div>
      </div>
      <div id="result-content" style="display:none"></div>
    </div>
  </div>
</div>

<script>
// ═══════════ 全局状态 ═══════════
const state = { wealthBase: 'exposure', resetToggle: 0 };

// ═══════════ 工具函数 ═══════════
function parseNum(s) { return parseFloat(s.replace(/[,，\s¥]/g, '')) || 0; }
function fmt(v) { return v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtPct(v, d) { d = d || 4; return (v * 100).toFixed(d) + '%'; }

const DEFAULTS = {
  amount: '14,290,000', deposit: '4,287,000', discountRate: '1.50',
  feeRate: '0.12', depositIntRate: '1.20', acceptanceFee: '0',
  termMonths: '6', loanRate: '2.11',
  depositRatio: '30.00', wm3mRate: '2.10', wm2mRate: '1.70', wm1mRate: '1.70',
  startDate: '2026-08-09', endDate: '2027-02-09',
};

// ═══════════ 千分位格式化：amount 输入框 ═══════════
(function() {
  var amtEl = document.getElementById('amount');
  if (amtEl) {
    amtEl.addEventListener('blur', function() {
      var raw = this.value.replace(/,/g, '');
      var num = parseInt(raw, 10);
      if (!isNaN(num)) this.value = num.toLocaleString('zh-CN');
      updateDeposit();
    });
    amtEl.addEventListener('focus', function() {
      this.value = this.value.replace(/,/g, '');
    });
  }
})();

// ═══════════ 折叠/展开事件委托 ═══════════
document.getElementById('result-area').addEventListener('click', function(e) {
  var hdr = e.target.closest('.collapsible .card-header');
  if (hdr) hdr.closest('.collapsible').classList.toggle('collapsed');
});

function updateDeposit() {
  var amt = parseNum(document.getElementById('amount').value);
  var ratio = parseNum(document.getElementById('depositRatio').value) / 100;
  document.getElementById('deposit').value = Math.round(amt * ratio).toLocaleString('zh-CN');
  calculate();
}

function toggleDateMode() {
  var mode = document.querySelector('input[name="dateMode"]:checked').value;
  var startEl = document.getElementById('startDate');
  var endEl = document.getElementById('endDate');
  var termEl = document.getElementById('termMonths');
  var hintEl = document.getElementById('dateHint');

  if (mode === 'month') {
    startEl.disabled = true;
    endEl.disabled = true;
    startEl.style.color = '#aaa';
    endEl.style.color = '#aaa';
    termEl.readOnly = false;
    termEl.style.color = '';
    hintEl.textContent = '';
  } else {
    startEl.disabled = false;
    endEl.disabled = false;
    startEl.style.color = '';
    endEl.style.color = '';
    termEl.readOnly = true;
    termEl.style.color = '#aaa';
  }
  calculate();
}

function syncDates() {
  if (document.querySelector('input[name="dateMode"]:checked').value !== 'day') return;
  var sd = document.getElementById('startDate').value;
  var ed = document.getElementById('endDate').value;
  if (!sd || !ed) return;
  var start = new Date(sd);
  var end = new Date(ed);
  var diff = Math.round((end - start) / 86400000);
  if (diff < 1) return;
  var months = Math.round(diff / 30);
  document.getElementById('dateHint').textContent = '共 ' + diff + ' 天 / ';
  document.getElementById('termMonths').value = months;
  calculate();
}

function syncDatesFromMonths() {
  var sd = document.getElementById('startDate').value;
  var months = parseInt(document.getElementById('termMonths').value) || 6;
  if (!sd) return;
  var start = new Date(sd);
  start.setMonth(start.getMonth() + months);
  var y = start.getFullYear();
  var m = String(start.getMonth() + 1).padStart(2, '0');
  var d = String(start.getDate()).padStart(2, '0');
  document.getElementById('endDate').value = y + '-' + m + '-' + d;
  syncDates();
}

function resetForm() {
  var btn = document.querySelector('.btn-reset');
  // 重置为月份模式
  document.querySelector('input[name="dateMode"][value="month"]').checked = true;
  if (state.resetToggle === 0) {
    // 恢复默认值
    for (var key in DEFAULTS) {
      if (DEFAULTS.hasOwnProperty(key)) {
        var el = document.getElementById(key);
        if (el) el.value = DEFAULTS[key];
      }
    }
    state.wealthBase = 'exposure';
    if (btn) btn.textContent = '一键清零';
    state.resetToggle = 1;
  } else {
    // 一键清零
    var clearFields = ['amount','deposit','depositRatio','discountRate','feeRate','depositIntRate','acceptanceFee','loanRate','wm3mRate','wm2mRate','wm1mRate'];
    for (var i = 0; i < clearFields.length; i++) {
      var el = document.getElementById(clearFields[i]);
      if (el) el.value = '';
    }
    document.getElementById('startDate').value = DEFAULTS.startDate;
    document.getElementById('endDate').value = DEFAULTS.endDate;
    state.wealthBase = 'exposure';
    if (btn) btn.textContent = '恢复默认值';
    state.resetToggle = 0;
  }
  toggleDateMode();
  document.getElementById('result-content').style.display = 'none';
  document.getElementById('result-empty').style.display = '';
}

function splitWealthMonths(remaining, rates) {
  var combos = []; var m = remaining;
  while (m >= 3) { combos.push({ termMonths: 3, rate: rates.m3 }); m -= 3; }
  while (m >= 2) { combos.push({ termMonths: 2, rate: rates.m2 }); m -= 2; }
  while (m >= 1) { combos.push({ termMonths: 1, rate: rates.m1 }); m -= 1; }
  return combos;
}

function rateColor(rate, baseRate) {
  var ratio = baseRate > 0 ? rate / baseRate : 1;
  if (ratio < 0.15) return '#0d8040';
  if (ratio < 0.4)  return '#1e8e3e';
  if (ratio < 0.7)  return '#e37400';
  return '#c5221f';
}

function chipClass(rate, baseRate) {
  var ratio = baseRate > 0 ? rate / baseRate : 1;
  if (ratio < 0.15) return 'low';
  if (ratio < 0.55) return 'mid';
  return 'high';
}

// ═══════════ 纯函数：computeLC ═══════════
function computeLC(params) {
  var amount = params.amount;
  var deposit = params.deposit;
  var discountRate = params.discountRate;
  var feeRate = params.feeRate;
  var depositIntRate = params.depositIntRate;
  var acceptanceFee = params.acceptanceFee;
  var termMonths = params.termMonths;
  var loanRate = params.loanRate;
  var wm3mRate = params.wm3mRate;
  var wm2mRate = params.wm2mRate;
  var wm1mRate = params.wm1mRate;
  var wealthBase = params.wealthBase;

  var exposure = amount - deposit;
  var days = params.days;
  var wealthPrincipal = (wealthBase === 'amount') ? amount : exposure;
  var dayFraction = days / 360;

  var discountInterest = Math.round(discountRate * amount * dayFraction * 100) / 100;
  var issuanceFee = Math.round(feeRate * amount * 100) / 100;
  var feeSubtotal = discountInterest + issuanceFee + acceptanceFee;
  var depositInterest = Math.round(depositIntRate * deposit * dayFraction * 100) / 100;
  var totalCost = feeSubtotal - depositInterest;
  var annualRate = totalCost / exposure / days * 360;

  var loanTotalCost = Math.round(exposure * loanRate * dayFraction * 100) / 100;
  var diff = loanTotalCost - totalCost;
  var lcWins = diff > 0;

  // 敏感度
  var sensRows = [];
  for (var r = 0.015; r <= 0.025; r += 0.002) {
    var di = Math.round(r * amount * dayFraction * 100) / 100;
    var fs = issuanceFee + di + acceptanceFee;
    var tc = fs - depositInterest;
    var ar = tc / exposure / days * 360;
    var lt = Math.round(exposure * loanRate * dayFraction * 100) / 100;
    sensRows.push({ rate: r, discountInterest: di, totalCost: tc, annualRate: ar, loanCost: lt, diff: lt - tc });
  }

  // 资金周转
  var turnoverRows = [];
  for (var repaidMonth = 1; repaidMonth < termMonths; repaidMonth++) {
    var remaining = termMonths - repaidMonth;
    var combos = splitWealthMonths(remaining, { m3: wm3mRate, m2: wm2mRate, m1: wm1mRate });
    var wealthIncome = 0;
    for (var ci = 0; ci < combos.length; ci++) {
      wealthIncome += wealthPrincipal * combos[ci].rate * (combos[ci].termMonths / 12);
    }
    wealthIncome = Math.round(wealthIncome * 100) / 100;

    var netCost = totalCost - wealthIncome;
    var netAnnualRate = netCost / exposure / days * 360;
    var totalIncome = depositInterest + wealthIncome;
    var reductionPct = totalCost > 0 ? (wealthIncome / totalCost * 100) : 0;
    var comboDesc = combos.map(function(c) { return c.termMonths + 'M'; }).join(' + ');

    turnoverRows.push({ repaidMonth: repaidMonth, remaining: remaining, comboDesc: comboDesc,
      wealthIncome: wealthIncome, totalIncome: totalIncome, netCost: netCost,
      netAnnualRate: netAnnualRate, reductionPct: reductionPct });
  }

  return {
    amount: amount, deposit: deposit, exposure: exposure, termMonths: termMonths, days: days,
    discountRate: discountRate, feeRate: feeRate, depositIntRate: depositIntRate,
    acceptanceFee: acceptanceFee, discountInterest: discountInterest, issuanceFee: issuanceFee,
    feeSubtotal: feeSubtotal, depositInterest: depositInterest, totalCost: totalCost,
    annualRate: annualRate, loanRate: loanRate, loanTotalCost: loanTotalCost,
    diff: diff, lcWins: lcWins, wealthPrincipal: wealthPrincipal, wealthBase: wealthBase,
    wm3mRate: wm3mRate, wm2mRate: wm2mRate, wm1mRate: wm1mRate,
    sensRows: sensRows, turnoverRows: turnoverRows
  };
}

      '<span id="copyMsg" style="font-size:12px;color:var(--success)"></span>' +
    '</div>' +
  '</div></div>';

  return html;
}

// ═══════════ calculate()：编排入口 ═══════════
function calculate() {
  var mode = document.querySelector('input[name="dateMode"]:checked').value;
  var days;
  if (mode === 'day') {
    var sd = document.getElementById('startDate').value;
    var ed = document.getElementById('endDate').value;
    days = (sd && ed) ? Math.round((new Date(ed) - new Date(sd)) / 86400000) : 180;
  } else {
    var months = parseInt(document.getElementById('termMonths').value) || 6;
    days = months * 30;
  }

  var params = {
    amount: parseNum(document.getElementById('amount').value),
    deposit: parseNum(document.getElementById('deposit').value),
    depositRatio: parseNum(document.getElementById('depositRatio').value),
    discountRate: parseNum(document.getElementById('discountRate').value) / 100,
    feeRate: parseNum(document.getElementById('feeRate').value) / 100,
    depositIntRate: parseNum(document.getElementById('depositIntRate').value) / 100,
    acceptanceFee: parseNum(document.getElementById('acceptanceFee').value),
    termMonths: parseInt(document.getElementById('termMonths').value) || 6,
    days: days,
    loanRate: parseNum(document.getElementById('loanRate').value) / 100,
    wm3mRate: parseNum(document.getElementById('wm3mRate').value) / 100,
    wm2mRate: parseNum(document.getElementById('wm2mRate').value) / 100,
    wm1mRate: parseNum(document.getElementById('wm1mRate').value) / 100,
    wealthBase: state.wealthBase,
  };

  // 记住资金周转明细卡是否已展开
  var tCardEl = document.getElementById('turnoverCard');
  var tCardExpanded = tCardEl && !tCardEl.classList.contains('collapsed');

  // 计算
  var data = computeLC(params);

  // 渲染
  var html = renderResult(data, tCardExpanded);

  // 保存数据供分享 / switchCostDetail 使用
  window.lcData = {
    amount: data.amount,
    deposit: data.deposit,
    depositPct: params.depositRatio,
    exposure: data.exposure,
    termMonths: data.termMonths,
    discountRate: data.discountRate,
    feeRate: data.feeRate,
    depositIntRate: data.depositIntRate,
    acceptanceFee: data.acceptanceFee,
    discountInterest: data.discountInterest,
    issuanceFee: data.issuanceFee,
    feeSubtotal: data.feeSubtotal,
    depositInterest: data.depositInterest,
    totalCost: data.totalCost,
    annualRate: data.annualRate,
    loanRate: data.loanRate,
    loanTotalCost: data.loanTotalCost,
    diff: data.diff,
    lcWins: data.lcWins,
    wealthPrincipal: data.wealthPrincipal,
    wealthBase: data.wealthBase,
    wm3mRate: data.wm3mRate,
    wm2mRate: data.wm2mRate,
    wm1mRate: data.wm1mRate,
    turnoverRows: data.turnoverRows,
    sensRows: data.sensRows
  };

  // 插入 DOM
  document.getElementById('result-content').innerHTML = html;
  document.getElementById('result-empty').style.display = 'none';
  document.getElementById('result-content').style.display = '';
}

    text += '保证金比例：' + d.depositPct + '%\n';
    text += '保证金：¥' + fmt(d.deposit) + '\n';
    text += '融资敞口：¥' + fmt(d.exposure) + '\n';
    text += '年化成本率（基准）：' + fmtPct(d.annualRate) + '\n';
    text += '融资总成本（基准）：¥' + fmt(d.totalCost) + '\n';
    text += '期限：' + d.termMonths + ' 个月\n\n';
  }

  if (checks[1].checked) {
    var wlbl = d.wealthBase === 'amount' ? '（含保证金，本金¥' + fmt(d.wealthPrincipal) + '）' : '（不含保证金，敞口¥' + fmt(d.wealthPrincipal) + '）';
    text += '▎实际融资成本率速览 ' + wlbl + '\n';
    text += '基准（无理财）：' + fmtPct(d.annualRate) + '\n';
    for (var i = 0; i < d.turnoverRows.length; i++) {
      var r = d.turnoverRows[i];
      var tag = r.reductionPct >= 100 ? ' 完全覆盖' : ' 降幅' + r.reductionPct.toFixed(0) + '%';
      text += r.repaidMonth + '个月回款：' + fmtPct(r.netAnnualRate) + tag + '\n';
    }
    text += '\n';
  }

  if (checks[2].checked) {
    text += '▎资金周转明细\n';
    text += '回款\t实际年化\t剩余月\t组合\t真实成本\t降幅\n';
    for (var i = 0; i < d.turnoverRows.length; i++) {
      var r = d.turnoverRows[i];
      text += r.repaidMonth + '月\t' + fmtPct(r.netAnnualRate) + '\t' + r.remaining + '\t' + r.comboDesc + '\t¥' + fmt(r.netCost) + '\t' + (r.reductionPct >= 100 ? '覆盖' : '-' + r.reductionPct.toFixed(1) + '%') + '\n';
    }
    text += '\n';
  }

  if (checks[3].checked) {
    text += '▎成本明细\n';
    text += '贴现利息：¥' + fmt(d.discountInterest) + ' (' + fmtPct(d.discountRate) + ')\n';
    text += '开证手续费：¥' + fmt(d.issuanceFee) + '\n';
    text += '承兑费：¥' + fmt(d.acceptanceFee) + '\n';
    text += '费用合计：¥' + fmt(d.feeSubtotal) + '\n';
    text += '保证金存款利息：-¥' + fmt(d.depositInterest) + '\n';
    text += '融资总成本（无理财）：¥' + fmt(d.totalCost) + '\n\n';
  }

  if (checks[4].checked) {
    text += '▎信用证 vs 流动资金贷款\n';
    text += '信用证总成本：¥' + fmt(d.totalCost) + ' 年化 ' + fmtPct(d.annualRate) + '\n';
    text += '流动贷款总成本：¥' + fmt(d.loanTotalCost) + ' 年化 ' + fmtPct(d.loanRate) + '\n';
    var diffAbs = fmt(Math.abs(d.diff));
    if (Math.abs(d.diff) < 0.01) text += '结论：两者持平\n\n';
    else if (d.lcWins) text += '结论：信用证更优，节省 ¥' + diffAbs + '\n\n';
    else text += '结论：流贷更优，节省 ¥' + diffAbs + '\n\n';
  }

  if (checks[5].checked) {
    text += '▎贴现利率敏感度\n';
    text += '利率\t年化成本率\tvs贷款\n';
    for (var i = 0; i < d.sensRows.length; i++) {
      var s = d.sensRows[i];
      var v = Math.abs(s.diff) < 0.01 ? '持平' : (s.diff > 0 ? '信用证优' : '贷款优');
      text += (s.rate * 100).toFixed(2) + '%\t' + fmtPct(s.annualRate) + '\t' + v + '\n';
    }
  }

  navigator.clipboard.writeText(text).then(function() {
    document.getElementById('copyMsg').textContent = '已复制到剪贴板，可粘贴到微信发送';
    setTimeout(function() { document.getElementById('copyMsg').textContent = ''; }, 3000);
  }).catch(function() {
    document.getElementById('copyMsg').textContent = '复制失败，请手动选择复制';
  });
}

// ═══════════ switchCostDetail（健壮性增强） ═══════════
function switchCostDetail() {
  if (!window.lcData) return;
  var d = window.lcData;
  var sel = document.getElementById('costDetailSelect');
  if (!sel) return;
  var val = sel.value;
  var h = '';

  h += '<div class="detail-row"><span>④ 保证金存款利息 <span class="desc">' + fmtPct(d.depositIntRate) + '，收入抵减</span></span><span class="amount income">−¥' + fmt(d.depositInterest) + '</span></div>';

  if (val === 'none') {
    h += '<div class="detail-row total"><span>融资总成本（无理财）</span><span class="amount">¥' + fmt(d.totalCost) + '</span></div>';
    h += '<div class="detail-row total"><span>基准年化成本率</span><span class="amount pct">' + fmtPct(d.annualRate) + '</span></div>';
  } else {
    var m = parseInt(val);
    var row = null;
    for (var i = 0; i < d.turnoverRows.length; i++) {
      if (d.turnoverRows[i].repaidMonth === m) { row = d.turnoverRows[i]; break; }
    }
    if (row) {
      h += '<div class="detail-row"><span>⑤ 理财利息收入 <span class="desc">' + row.comboDesc + '，本金 ¥' + fmt(d.wealthPrincipal) + '</span></span><span class="amount income">−¥' + fmt(row.wealthIncome) + '</span></div>';
      h += '<div class="detail-row total"><span>收入合计 (④+⑤)</span><span class="amount income">−¥' + fmt(row.totalIncome) + '</span></div>';
      h += '<div class="detail-row total"><span>真实融资成本</span><span class="amount">¥' + fmt(row.netCost) + '</span></div>';
      h += '<div class="detail-row total"><span>真实融资成本率（年化）</span><span class="amount pct">' + fmtPct(row.netAnnualRate) + '</span></div>';
    }
  }

  var el = document.getElementById('costDetailDynamic');
  if (el) el.innerHTML = h;
}

// ═══════════ 生成海报 ═══════════
function generatePoster() {
  if (!window.lcData) { alert('请先点击计算'); return; }
  var btn = document.getElementById('posterBtn');
  if (!btn) return;
  var originalText = btn.textContent;
  btn.textContent = '生成中…';
  btn.disabled = true;

  var target = document.getElementById('result-content');
  if (!target) { btn.textContent = originalText; btn.disabled = false; return; }

  if (typeof html2canvas === 'undefined') {
    btn.textContent = originalText;
    btn.disabled = false;
    alert('html2canvas 未加载，请检查网络连接后刷新页面重试');
    return;
  }

  // 等待 loading 态渲染后再截取
  setTimeout(function() {
    // 1. 定位分享卡片（result-content 内最后一个 .card）
    var shareCard = target.querySelector('.card:last-child');

    // 2. 截取前准备：隐藏分享卡片、恢复按钮文字、插入海报标题栏和 footer
    if (shareCard) shareCard.style.display = 'none';
    btn.textContent = '生成海报';

    // 生成日期字符串
    var now = new Date();
    var dateStr = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
    var timeStr = now.toLocaleString('zh-CN');

    // 插入海报标题栏
    var headerBar = document.createElement('div');
    headerBar.id = '__poster_header__';
    headerBar.style.cssText = 'background:#1a73e8;padding:20px 24px;border-radius:12px 12px 0 0;margin-bottom:0';
    headerBar.innerHTML = '<div style="font-size:22px;font-weight:700;color:#fff;line-height:1.3">国内信用证融资成本测算</div>' +
      '<div style="font-size:13px;color:rgba(255,255,255,.7);margin-top:4px">' + dateStr + '</div>';
    target.insertBefore(headerBar, target.firstChild);

    // 插入海报底部 footer
    var footerBar = document.createElement('div');
    footerBar.id = '__poster_footer__';
    footerBar.style.cssText = 'background:#f5f6f8;border-top:1px solid #dadce0;padding:14px 24px;border-radius:0 0 12px 12px;' +
      'display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#999';
    footerBar.innerHTML = '<span>* 本测算结果仅供参考，不构成融资决策建议</span>' +
      '<span>生成于 ' + timeStr + '</span>';
    target.appendChild(footerBar);

    // 3. 截取
    html2canvas(target, { scale: 2, backgroundColor: '#f5f6f8' }).then(function(canvas) {
      // 4. 截取后清理：移除标题栏、footer、恢复分享卡片
      if (headerBar && headerBar.parentNode) headerBar.parentNode.removeChild(headerBar);
      if (footerBar && footerBar.parentNode) footerBar.parentNode.removeChild(footerBar);
      if (shareCard) shareCard.style.display = '';

      canvas.toBlob(function(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = '融资成本测算海报.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        // 尝试复制图片到剪贴板
        try {
          navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        } catch(e) {}

        btn.textContent = originalText;
        btn.disabled = false;
      }, 'image/png');
    }).catch(function() {
      // 异常时也要清理
      if (headerBar && headerBar.parentNode) headerBar.parentNode.removeChild(headerBar);
      if (footerBar && footerBar.parentNode) footerBar.parentNode.removeChild(footerBar);
      if (shareCard) shareCard.style.display = '';
      btn.textContent = originalText;
      btn.disabled = false;
      alert('海报生成失败，请重试');
    });
  }, 150);
}
</script>
